<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор МЭДО</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f8f9fb; --line: #dfe3e8; --text: #1d232b;
  --muted: #667085; --accent: #2457c5; --accent-weak: #e8eefb; --ok: #1a7f4b; --ok-weak: #e6f4ec;
  --err: #b42318; --err-weak: #fdecea; --warn: #9a6200; --warn-weak: #fff4dc; --code: #f3f4f6;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --panel2: #222731; --line: #313844; --text: #e6e9ef;
    --muted: #98a2b3; --accent: #6d9bff; --accent-weak: #1f2b45; --ok: #4cc38a; --ok-weak: #15301f;
    --err: #ff7b72; --err-weak: #3a1d1b; --warn: #f0b44c; --warn-weak: #36290f; --code: #171a20;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.bar { max-width: 1400px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.logo { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
.logo small { color: var(--muted); font-weight: 400; margin-left: 6px; }
nav { display: flex; gap: 4px; }
nav button { border: 0; background: none; padding: 7px 12px; border-radius: 6px; color: var(--muted); font: inherit; cursor: pointer; }
nav button.on { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
.grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 12px; }
.card h3 { font-size: 13px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.sticky { position: sticky; top: 70px; }
.pkg-layout { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; align-items: start; }
.pkg-toc { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 2px; padding: 10px; }
.pkg-toc a { color: var(--accent); cursor: pointer; padding: 5px 6px; border-radius: 6px; font-size: 13px; }
.pkg-toc a:hover { background: var(--accent-weak); }
.pkg-toc .n { color: var(--muted); }
#pkg-out, #pkg-list, #pkg-detail { scroll-margin-top: 70px; }
.fold { cursor: pointer; user-select: none; }
@media (max-width: 1000px) { .pkg-layout { grid-template-columns: 1fr; } .pkg-toc { position: static; flex-direction: row; flex-wrap: wrap; } }
@media (max-width: 1000px) { header { position: static; } .sticky { position: static; } }
label.f { display: block; margin-bottom: 10px; }
label.f > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
input[type=text], input[type=date], input[type=number], input:not([type]), select, textarea {
  width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--text); font: inherit; }
textarea { min-height: 60px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-weak); border-color: var(--accent); }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.row > label.f { margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 6px 14px; font: inherit; cursor: pointer; color: var(--text); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #fff; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; background: var(--panel); text-align: left; font: inherit; color: var(--text); }
.tile b { display: block; font-size: 13px; }
.tile span { font-size: 12px; color: var(--muted); }
.tile.on { border-color: var(--accent); background: var(--accent-weak); }
.tile:disabled { opacity: .45; cursor: not-allowed; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 13px; border-radius: 6px; font: inherit; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
a.btn { text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.danger { color: var(--err); }
.btn:disabled { opacity: .5; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.check { display: flex; gap: 7px; align-items: flex-start; margin: 6px 0; cursor: pointer; }
.check input { margin-top: 3px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12px; }
.gas-pick { position: relative; }
.gas-res { position: absolute; z-index: 30; left: 0; right: 0; top: 100%; margin-top: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 14px rgba(16,24,40,.15); max-height: 320px; overflow: auto; }
.gas-item { padding: 6px 9px; cursor: pointer; border-bottom: 1px solid var(--line); }
.gas-item:hover { background: var(--accent-weak); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
.pill.err { background: var(--err-weak); color: var(--err); border-color: transparent; }
.pill.acc { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
.msg { padding: 9px 12px; border-radius: 7px; margin: 8px 0; }
.msg.ok { background: var(--ok-weak); color: var(--ok); }
.msg.err { background: var(--err-weak); color: var(--err); }
.msg.warn { background: var(--warn-weak); color: var(--warn); }
.msg ul { margin: 4px 0 0; padding-left: 18px; }
.orglist { max-height: 210px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--panel); }
.orglist .check { margin: 3px 0; }
.bad, input.bad, select.bad, textarea.bad, .orglist.bad { border-color: var(--err) !important; background: var(--err-weak) !important; }
.req { color: var(--err); margin-left: 2px; }
.errlist li { cursor: pointer; text-decoration: underline dotted; }
.box { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; background: var(--panel2); margin-bottom: 10px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: var(--panel2); }
.item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--panel2); }
tr.sel td { background: var(--accent-weak); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 10px; margin: 8px 0; }
.kv > div:nth-child(odd) { color: var(--muted); font-size: 12px; padding-top: 1px; }
.kv > div { min-width: 0; overflow-wrap: anywhere; }
.copy { cursor: pointer; border-bottom: 1px dotted var(--muted); }
.files { list-style: none; padding: 0; margin: 6px 0; }
.files li { padding: 3px 0; }
.files ul { list-style: none; padding-left: 18px; margin: 2px 0; }
.files a { color: var(--accent); cursor: pointer; text-decoration: none; }
.files a:hover { text-decoration: underline; }
.empty { color: var(--muted); padding: 30px 10px; text-align: center; }
dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; width: min(1000px, 94vw); background: var(--panel); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); gap: 10px; }
pre.view { margin: 0; padding: 14px; max-height: 72vh; overflow: auto; background: var(--code); font: 12px/1.45 Consolas, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 7px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.on { opacity: .95; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.filters > * { width: auto; }
.filters input { min-width: 220px; flex: 1; }
details summary { cursor: pointer; color: var(--muted); margin: 8px 0; }
.hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Генератор МЭДО<small>2.6 · 2.7 · 2.7.1 · 3.0</small></div>
    <nav id="nav">
      <button data-tab="create" class="on">Создать пакет</button>
      <button data-tab="packages">Пакеты</button>
      <button data-tab="scenarios">Сценарии</button>
      <button data-tab="orgs">Организации</button>
    </nav>
    <div class="spacer"></div>
    <label class="small muted" for="stand">Стенд</label>
    <select id="stand" style="width:auto;min-width:180px;max-width:320px"></select>
    <span id="xsd" class="pill"></span>
  </div>
</header>
<main>
  <section id="tab-create"></section>
  <section id="tab-packages" class="hidden"></section>
  <section id="tab-scenarios" class="hidden"></section>
  <section id="tab-orgs" class="hidden"></section>
</main>

<dialog id="viewer">
  <div class="dlg-head"><b id="viewer-title"></b>
    <div class="actions"><a id="viewer-dl" class="btn small">Скачать файл</a>
      <button class="btn small" onclick="copyText(document.getElementById('viewer-text').textContent)">Копировать</button>
      <button class="btn small" onclick="document.getElementById('viewer').close()">Закрыть</button></div>
  </div>
  <pre class="view" id="viewer-text"></pre>
</dialog>
<dialog id="replies">
  <div class="dlg-head"><b id="replies-title"></b>
    <button class="btn small" onclick="document.getElementById('replies').close()">Закрыть</button></div>
  <div id="replies-body" style="padding:14px 16px;max-height:78vh;overflow:auto"></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ---------- утилиты ----------
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k === null || k === undefined || k === false) continue;
    el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return el;
}
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({ error: "некорректный ответ сервера" }));
  if (!r.ok || data.error && !("packages" in data)) throw new Error(data.error || r.statusText);
  return data;
}
async function upload(file) {
  const r = await fetch("/api/upload", { method: "POST", headers: { "X-Filename": encodeURIComponent(file.name) }, body: file });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error);
  return data;
}
function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800);
}
function copyText(text) {
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
    () => toast("Скопировано"),
    () => { const ta = h("textarea", { value: text }); document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); toast("Скопировано"); });
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("medogen." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("medogen." + k, JSON.stringify(v)); } catch {} },
};
function isoToday(add = 0) { const d = new Date(); d.setDate(d.getDate() + add); return d.toISOString().slice(0, 10); }
function fmtSize(n) { return n < 1024 ? n + " Б" : n < 1048576 ? (n / 1024).toFixed(1) + " КБ" : (n / 1048576).toFixed(1) + " МБ"; }
// путь в объекте состояния: get/set по "a.b.0.c"
function getp(o, p) { return p.split(".").reduce((a, k) => a == null ? a : a[k], o); }
function setp(o, p, v) { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks.at(-1)] = v; }

// ---------- общие данные ----------
let META = null, ORGS = { orgs: [] }, PACKAGES = [];
const TYPE_HINT = {
  document: "ТК ДЭВ, в 3.0 можно ТК ГосЭДО", gosedo: "TC00000007, только 3.0",
  citizen_appeal: "CardInfo / enclosure_cardinfo", receipt: "Ответ на пакет",
  notification: "Ответ на пакет", assignment: "digital.xml, события",
};
const NOTIF_30 = ["registered", "refused"];
// Семейство формата, как builder.family: 2.0–2.6 собираются по структуре 2.6
const fam = f => ["3.0", "2.7.1", "2.7"].includes(f) ? f : /^2\.[0-6]$/.test(f || "") ? "2.6" : f;
const isOld = f => ["2.7", "2.6"].includes(fam(f));
const FORMAT_LABEL = { "3.0": "3.0", "2.7.1": "2.7.1", "2.7": "2.7", "2.6": "2.6 и ниже" };
const refusalList = f => isOld(f) ? META.refusal_reasons_old : META.refusal_reasons;
const OLD_VERSIONS = ["2.6", "2.5", "2.4", "2.3", "2.2", "2.1", "2.0"];

function orgName(guid) { const o = ORGS.orgs.find(o => o.guid === guid || o.key === guid) || GAS_PICKED[guid]; return o ? o.name : guid; }
function orgOptions(value, allowEmpty) {
  const gasOpt = value && !ORGS.orgs.some(o => o.key === value) && GAS_PICKED[value];
  return [allowEmpty ? h("option", { value: "" }, allowEmpty) : null,
    ...ORGS.orgs.map(o => h("option", { value: o.key, selected: o.key === value }, `${o.name}${o.key === ORGS.self ? " (своя)" : ""}`)),
    gasOpt ? h("option", { value, selected: true }, `${gasOpt.name} (из ГАС)`) : null];
}

// ---------- справочник ГАС ----------
// организации, выбранные из ГАС в форме: в сценарий уходит их GUID, адрес сервер берёт из gas\gas.json
const GAS_PICKED = store.get("gas_picked", {});
function rememberGas(o) { GAS_PICKED[o.guid] = o; store.set("gas_picked", GAS_PICKED); }
function gasPicker(onPick, placeholder) {
  let timer = null, seq = 0;
  const res = h("div", { class: "gas-res hidden" });
  const inp = h("input", { placeholder: placeholder || "Найти в справочнике ГАС: название, адрес МЭДО или GUID",
    oninput: () => { clearTimeout(timer); timer = setTimeout(run, 200); }, onfocus: () => inp.value && run(),
    onkeydown: e => { if (e.key === "Escape") res.classList.add("hidden"); } });
  inp.addEventListener("blur", () => setTimeout(() => res.classList.add("hidden"), 200));
  async function run() {
    const q = inp.value.trim(), my = ++seq;
    if (!q) { res.classList.add("hidden"); return; }
    let r; try { r = await api("/api/gas?q=" + encodeURIComponent(q)); } catch (e) { return; }
    if (my !== seq) return;
    res.innerHTML = ""; res.classList.remove("hidden");
    if (!r.items.length) res.append(h("div", { class: "muted small", style: "padding:6px 9px" },
      r.total ? "Ничего не найдено" : "Справочник ГАС пуст: загрузите его на вкладке «Организации»"));
    r.items.forEach(o => res.append(h("div", { class: "gas-item", onmousedown: e => e.preventDefault(),
      onclick: () => { rememberGas(o); inp.value = ""; res.classList.add("hidden"); onPick(o); } },
      h("div", {}, o.name, o.active === false ? h("span", { class: "pill err", style: "margin-left:6px" }, "неактивен") : null),
      o.org ? h("div", { class: "small muted" }, o.org) : null,
      h("div", { class: "small muted mono" }, (o.address || "адрес не указан") + " · " + o.guid))));
    if (r.found > r.items.length) res.append(h("div", { class: "muted small", style: "padding:6px 9px" }, `и ещё ${r.found - r.items.length}, уточните запрос`));
  }
  return h("div", { class: "gas-pick" }, inp, res);
}
function typeTitle(p) {
  if (p.type === "incoming") return "Входящий";
  let t = META.types[p.type] || p.type;
  if (p.type === "assignment" && p.event) t += ": " + (META.events[p.event] || p.event).toLowerCase();
  return t;
}

// ---------- состояние формы ----------
const S = store.get("form", null) || {};
function resetForm(keep) {
  const base = { format: keep?.format || "3.0", type: keep?.type || "document", from: "", to: [], reply: null,
    subject: "", time_limit: "", message_file: "",
    document: { annotation: "", reg_number: "", reg_date: "", kind: "DK00000000", classification: "DC00000000",
      place: "DP00000077", pages: 1, signer_post: "", signer_name: "", executor_name: "", executor_phone: "",
      attachments: [], pdf: null, include_pdf: false },
    container: "dev", with_digital: false, notify_sent: false, need_registration: true, need_execution: false,
    citizen: { last_name: "Иванов", first_name: "Иван", middle_name: "Иванович", email: "test@example.ru", phone: "",
      number: "", date: "", region: "", town: "", comment: "", rubrics: "", appeal: null },
    receipt: { accepted: true, error_code: 0, comment: "", reasons: ["101"] },
    notification: { kind: "registered", number: "", date: "", reasons: ["203"], comment: "", text: "",
      secretary: "", manager: "", executor: "", signatory: "", signatory_post: "", report_number: "", report_date: "",
      publication_point: "" },
    assignment: { event: "issue", author: "", items: [{ number: "1", text: "", deadline: isoToday(30), executor: "", coexecutors: [] }],
      new_deadline: isoToday(60), remarks: "", fix_deadline: isoToday(14) },
  };
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, base);
}
if (!S.document) resetForm();
function save() { store.set("form", S); }

function bind(path, attrs = {}, rerender) {
  const v = getp(S, path);
  const { tag = "input", options = [], ...rest } = attrs;
  const el = h(tag, rest);
  el.dataset.path = path;
  if (tag === "select") options.forEach(o => el.append(o));
  el.value = v ?? "";
  el.addEventListener(tag === "select" ? "change" : "input", () => {
    el.classList.remove("bad");
    let val = el.value;
    if (attrs.type === "number") val = val === "" ? "" : Number(val);
    setp(S, path, val); save(); if (rerender) renderCreate();
  });
  return el;
}
function field(label, el, hint) {
  const req = typeof label === "string" && label.endsWith(" *");
  return h("label", { class: "f" }, h("span", {}, req ? label.slice(0, -2) : label, req ? h("span", { class: "req", title: "обязательное поле" }, "*") : null),
    el, hint ? h("div", { class: "hint", style: "margin:3px 0 0" }, hint) : null);
}
function checkbox(path, label, rerender) {
  const el = h("input", { type: "checkbox", checked: !!getp(S, path), onchange: () => { setp(S, path, el.checked); save(); if (rerender) renderCreate(); } });
  return h("label", { class: "check" }, el, h("span", {}, label));
}
function fileInput(path, label, accept) {
  const cur = getp(S, path);
  const inp = h("input", { type: "file", accept, class: "hidden", onchange: async () => {
    const f = inp.files[0]; if (!f) return;
    try { const r = await upload(f); setp(S, path, { path: r.path, name: r.name }); save(); renderCreate(); }
    catch (e) { toast("Ошибка загрузки: " + e.message); }
  } });
  return h("div", { class: "actions", style: "margin-bottom:10px" },
    h("button", { class: "btn small", type: "button", onclick: () => inp.click() }, cur ? "Заменить файл" : label), inp,

// ---------- сборка сценария из формы ----------
function nz(v) { return v === "" || v === null || v === undefined ? undefined : v; }

  if (Array.isArray(o)) return o.map(clean);
  if (o && typeof o === "object") { const r = {}; for (const [k, v] of Object.entries(o)) { const c = clean(v); if (c !== undefined && !(typeof c === "object" && !Array.isArray(c) && !Object.keys(c).length)) r[k] = c; } return r; }
  return nz(o);
}
function buildSpec() {
  const t = S.type, spec = { format: S.format, type: t, name: META.types[t] };
  if (fam(S.format) === "2.6" && S.sign_files && ["document", "citizen_appeal"].includes(t)) spec.sign_files = true;
  if (S.from) spec.from = S.from;
  if (S.to.length) spec.to = [...S.to];
  if (needsReply() || replyDoc()) {
    if (!S.reply) throw new Error(S.type === "assignment" ? "Выберите пакет выдачи поручения" : "Выберите исходный пакет для ответа");
    spec[t === "assignment" ? "based_on" : "reply_to"] = "ui:" + S.reply.id;
  }
  if (!spec.to && !spec.reply_to && !spec.based_on && t !== "assignment") throw new Error("Выберите получателя");
  spec.subject = nz(S.subject); spec.time_limit = nz(S.time_limit);
  if (["document", "gosedo", "citizen_appeal", "assignment"].includes(t)) {
    const d = S.document;
    const doc = { annotation: nz(d.annotation), reg_number: nz(d.reg_number), reg_date: nz(d.reg_date), pages: nz(d.pages),
      classification: d.classification, place: d.place, pdf: d.pdf?.path };
    if (d.kind === "__custom") { if (!d.kind_id || !d.kind_name) throw new Error("Укажите код и наименование вида документа"); doc.kind = { id: d.kind_id, name: d.kind_name }; }
    else if (!(t === "assignment" && d.kind === "DK00000000")) doc.kind = d.kind;
    if (d.signer_post || d.signer_name) doc.signer = { post: nz(d.signer_post), name: nz(d.signer_name) };
    if (d.executor_name || d.executor_phone) doc.executor = { name: nz(d.executor_name), phone: nz(d.executor_phone) };
    doc.attachments = d.attachments.map(a => a.file ? { file: a.file.path, description: nz(a.description), signed: a.signed } : { description: nz(a.description) || "Приложение", pages: nz(a.pages), signed: a.signed });
    if (d.include_pdf) doc.include_pdf = true;
    spec.document = doc;
    if (S.format === "3.0" && (t === "document" || t === "assignment")) spec.container = S.container;
    if (t === "document" && S.format === "3.0" && S.container === "dev" && S.with_digital) spec.with_digital = true;
    if ((t === "document" || t === "citizen_appeal") && S.format === "2.7.1" && S.notify_sent)
      spec.notify_sent = { need_registration: S.need_registration, need_execution: S.need_execution };
  }
  if (t === "citizen_appeal") {
    const c = S.citizen;
    spec.citizen = { last_name: c.last_name, first_name: c.first_name, middle_name: c.middle_name, email: c.email, phone: c.phone,
      number: c.number, date: c.date, appeal_file: c.appeal?.path,
      address: { Region: c.region, Town: c.town, Comment: c.comment },
      rubrics: c.rubrics ? c.rubrics.split(",").map(s => s.trim()).filter(Boolean) : undefined };
  }
  if (t === "receipt") {
    const r = S.receipt; spec.receipt = { accepted: r.accepted, comment: nz(r.comment) };
    if (!r.accepted) {
      if (S.format === "2.7.1") spec.receipt.error_code = Number(r.error_code || 0);
      else if (!isOld(S.format)) { if (!r.reasons.length) throw new Error("Отметьте хотя бы одну причину отказа"); spec.receipt.reasons = r.reasons.map(id => ({ id })); }
    }
  }
  if (t === "notification") {
    const n = S.notification, o = { kind: n.kind, comment: nz(n.comment) };
    if (n.kind === "registered") Object.assign(o, { number: nz(n.number), date: nz(n.date) });
    if (n.kind === "refused") { if (!n.reasons.length) throw new Error("Отметьте хотя бы одну причину отказа"); o.reasons = n.reasons; }
    if (n.kind === "executor_assigned") { if (n.secretary) o.secretary = { person: n.secretary }; if (n.manager) o.manager = { person: n.manager }; if (n.executor) o.executor = { person: n.executor }; }
    if (n.kind === "report_prepared" && (n.signatory || n.signatory_post)) o.signatory = { person: n.signatory || "Подписант", post: n.signatory_post || "Руководитель" };
    if (n.kind === "report_sent") o.report = { number: nz(n.report_number), date: nz(n.report_date) };
    if (n.kind === "course_changed") o.text = nz(n.text);
    if (n.kind === "published") Object.assign(o, { number: nz(n.number), publication_point: nz(n.publication_point) });
    spec.notification = o;
  }
  if (t === "assignment") {
    const a = S.assignment, o = { event: a.event };
    if (a.event === "issue") {
      if (a.author) o.author = { name: a.author };
      o.items = a.items.map(it => ({ number: nz(it.number), text: nz(it.text), deadline: nz(it.deadline), executor: nz(it.executor), coexecutors: it.coexecutors.length ? it.coexecutors : undefined }));
      if (!spec.to && !o.items.some(it => it.executor)) throw new Error("Укажите получателей или исполнителя хотя бы одного пункта");
    }
    if (a.event === "change_deadline") o.new_deadline = nz(a.new_deadline);
    if (a.event === "return") Object.assign(o, { remarks: nz(a.remarks), fix_deadline: nz(a.fix_deadline) });
    spec.assignment = o;
  }
  const settings = {}; if (S.message_file) settings.message_file = S.message_file;
  const scenario = clean({ settings, ...spec });
  return scenario;
}

// Обязательные поля формы: то, что генератор не может подставить сам.
function formErrors() {
  const E = [], t = S.type, add = (path, msg) => E.push({ path, msg });
  const okDate = v => !v || /^\d{4}-\d{2}-\d{2}$/.test(v);
  const posInt = v => v === "" || v == null || (Number.isInteger(Number(v)) && Number(v) >= 1);
  const replied = (needsReply() || replyDoc()) && S.reply;
  if ((needsReply() || replyDoc()) && !S.reply)
    add("reply", t === "assignment" ? "Пакет выдачи поручения, по которому событие" : "Исходный пакет, на который отвечаем");
  if (!S.from && !ORGS.self && !replied) add("from", "Отправитель: в стенде не задана своя организация");
  if (!S.to.length && !replied && t !== "assignment") add("to", "Хотя бы один получатель");
  if (["document", "gosedo", "citizen_appeal", "assignment"].includes(t)) {
    const d = S.document, p = "document.";
    if (d.kind === "__custom") {
      if (!/^DK\d{8}$/.test(d.kind_id || "")) add(p + "kind_id", "Код вида документа: DK и 8 цифр, например DK00000001");
      if (!(d.kind_name || "").trim()) add(p + "kind_name", "Наименование вида документа");
    }
    if (!okDate(d.reg_date)) add(p + "reg_date", "Дата регистрации в формате ГГГГ-ММ-ДД");
    if (!posInt(d.pages)) add(p + "pages", "Страниц в заглушке: целое число от 1");
    if (d.signer_post && !d.signer_name) add(p + "signer_name", "ФИО подписанта (указана только должность)");
    if (d.executor_phone && !d.executor_name) add(p + "executor_name", "ФИО исполнителя (указан только телефон)");
    d.attachments.forEach((a, i) => {
      if (!a.file && !posInt(a.pages)) add(`${p}attachments.${i}.pages`, `Приложение ${i + 1}: страниц — целое число от 1`);
    });
  }
  if (t === "citizen_appeal") {
    const c = S.citizen, p = "citizen.";
    if (!(c.last_name || "").trim()) add(p + "last_name", "Фамилия автора обращения");
    if (!(c.first_name || "").trim()) add(p + "first_name", "Имя автора обращения");
    if (c.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(c.email)) add(p + "email", "E-mail автора: неверный формат");
    if (!okDate(c.date)) add(p + "date", "Дата обращения в формате ГГГГ-ММ-ДД");
  }
  if (t === "receipt" && !S.receipt.accepted) {
    if (S.format === "3.0" && !S.receipt.reasons.length) add("receipt.reasons", "Хотя бы одна причина отказа в приёме");
    if (S.format === "2.7.1" && (S.receipt.error_code === "" || !Number.isInteger(Number(S.receipt.error_code))))
      add("receipt.error_code", "Код ошибки: целое число");
  }
  if (t === "notification" && S.notification.kind === "refused" && !S.notification.reasons.length)
    add("notification.reasons", "Хотя бы одна причина отказа в регистрации");
  if (t === "assignment") {
    const a = S.assignment, today = isoToday();
    if (a.event === "issue") {
      if (!S.to.length && !a.items.some(it => it.executor)) add("to", "Получатели или исполнитель хотя бы одного пункта");
      a.items.forEach((it, i) => {
        const p = `assignment.items.${i}.`;
        if (!(it.number || "").trim()) add(p + "number", `Пункт ${i + 1}: номер пункта`);
        if (!it.deadline) add(p + "deadline", `Пункт ${it.number || i + 1}: срок исполнения`);
        else if (it.deadline < (S.document.reg_date || today)) add(p + "deadline", `Пункт ${it.number || i + 1}: срок исполнения раньше даты регистрации`);
      });
    }
    if (a.event === "change_deadline" && !a.new_deadline) add("assignment.new_deadline", "Новый срок исполнения");
    if (a.event === "change_deadline" && a.new_deadline && a.new_deadline < today) add("assignment.new_deadline", "Новый срок исполнения уже прошёл");
    if (a.event === "return" && !a.fix_deadline) add("assignment.fix_deadline", "Срок доработки");
  }
  if (S.time_limit !== "" && S.time_limit != null && !posInt(S.time_limit)) add("time_limit", "timeLimit: целое число минут от 1");
  if (S.message_file && !/^[\w.\-]+\.xml$/i.test(S.message_file)) add("message_file", "Имя паспорта ЭС: латиница, оканчивается на .xml");
  return E;
}

    h("a", { onclick: () => go("pkg-list") }, "Собранные и входящие", h("span", { class: "n" }, ` (${PACKAGES.length})`)),

async function uploadIncoming(files) {
  if (!files.length) return;
  try {
    toast("Загрузка…");
    const ups = [];
    for (const f of files) ups.push((await upload(f)).path);
    const name = files[0].webkitRelativePath ? files[0].webkitRelativePath.split("/")[0] : "пакет";
    const card = await api("/api/incoming", { uploads: ups, name });
    await loadPackages(); PKG_SEL = card.id; PKG_DETAIL = card; switchTab("packages");
    toast(card.errors?.length ? "Пакет загружен, есть замечания проверки" : "Пакет загружен и проверен");
    if (card.from && !["receipt", "notification"].includes(card.type)) openReplies(card);
  } catch (e) { toast("Ошибка: " + e.message); }
}
async function openPackage(id) {
  PKG_SEL = id; PKG_DETAIL = null; renderPackages();
  try { PKG_DETAIL = await api("/api/package?id=" + encodeURIComponent(id)); } catch (e) { toast(e.message); }
  renderPackages();
}

// ---------- вкладка «Сценарии» ----------

      onclick: () => runScenario({ example: e.file }, e.file) }, SC_BUSY === e.file ? h("span", { class: "spin" }) : "Собрать"))))));

  left.append(h("h3", {}, "Свой сценарий"), h("div", { class: "actions" },

    h("div", { class: "hint", style: "margin-top:6px" }, "Пути к файлам в своём сценарии указывайте полностью (D:\\...). Формат описан в README."));
  const right = h("div", { class: "card sticky" }, h("h2", {}, "Результат"));

    right.append(h("table", {}, h("tbody", {}, ...SC_RESULT.packages.map(p => h("tr", { class: "click", onclick: () => { switchTab("packages"); openPackage(p.id); } },
      h("td", {}, typeTitle(p), h("div", { class: "small muted" }, p.name)), h("td", {}, p.format),
      h("td", {}, p.errors?.length ? h("span", { class: "pill err" }, "ошибки") : h("span", { class: "pill ok" }, "OK")),
      h("td", {}, h("a", { class: "btn small", href: "/api/download?id=" + encodeURIComponent(p.id), onclick: ev => ev.stopPropagation() }, ".zip")))))));
  }
  root.append(h("div", { class: "grid" }, left, right));
}
async function runScenario(body, title) {
  SC_BUSY = title; renderScenarios();
  try { SC_RESULT = await api("/api/build", { stand: currentStand(), ...body }); }
  catch (e) { SC_RESULT = { error: e.message, packages: [] }; }
  SC_RESULT.title = title; SC_BUSY = ""; await loadPackages(); renderScenarios();
}

        catch (err) { toast(err.message); } } }, "Сохранить"),
      ORG_EDIT ? h("button", { class: "btn", type: "button", onclick: () => { ORG_EDIT = null; renderOrgs(); } }, "Отмена") : null)));

  const ex = ORGS.exchange || {};
  const xo = h("input", { value: ex.out || "", class: "mono", placeholder: "\\\\srv-sed\\MEDO\\OUT" }),
    xa = h("input", { value: ex.archive || "", class: "mono", placeholder: "пусто — OUTArchiveGen рядом с OUT" }),
    xi = h("input", { value: ex.in || "", class: "mono", placeholder: "\\\\srv-sed\\MEDO\\IN" });
  const xres = h("div", {});

    field("OUT — исходящие СЭД", xo), field("OUTArchiveGen — забранные пакеты", xa), field("IN — входящие для СЭД", xi),

      h("button", { class: "btn", type: "button", onclick: async () => {

        try { await xsave(); const r = await api("/api/exchange/check", { stand: currentStand() });

            h("li", {}, h("b", {}, t + ": "), r[k].ok ? h("span", { class: "pill ok" }, "доступна") : h("span", { style: "color:var(--err)" }, r[k].error)))));
        } catch (err) { xres.append(h("div", { class: "msg err small" }, err.message)); } } }, "Проверить доступ")), xres));

    h("div", { class: "hint", style: "margin:0 0 10px" }, "Общий справочник всех участников (файл gas\\gas.json). Из него можно выбрать отправителя и получателей в форме, не добавляя их в стенд. Откройте ",

// ---------- навигация и загрузка ----------
let TAB = "create";
function switchTab(t) {
  TAB = t; store.set("tab", t);
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  ["create", "packages", "scenarios", "orgs"].forEach(x => $("#tab-" + x).classList.toggle("hidden", x !== t));
  render();
}
function render() { ({ create: renderCreate, packages: renderPackages, scenarios: renderScenarios, orgs: renderOrgs })[TAB](); }
function currentStand() { return $("#stand").value; }
async function setStand(file) {
  store.set("stand", file);
  fillStands(file);
  ORGS = await api("/api/orgs?stand=" + encodeURIComponent(file)); OUT_DATA = null;
  S.from = ORGS.orgs.some(o => o.key === S.from) || GAS_PICKED[S.from] ? S.from : "";
  S.to = S.to.filter(k => ORGS.orgs.some(o => o.key === k) || GAS_PICKED[k]);
  render();
}
function fillStands(sel) {
  const s = $("#stand"); s.innerHTML = "";
  META.stands.forEach(x => s.append(h("option", { value: x.file, selected: x.file === sel }, `${x.stand || x.file} (${x.count})`)));
}
async function loadMeta() {
  META = await api("/api/meta");
  const x = $("#xsd");
  x.textContent = META.xsd ? "проверка XSD включена" : "без lxml: только структура";
  x.className = "pill " + (META.xsd ? "ok" : "err");
  x.title = META.xsd ? "" : "pip install lxml — чтобы проверять пакеты по XSD";
}
async function loadPackages() { try { PACKAGES = await api("/api/packages"); } catch (e) { PACKAGES = []; } }

document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => switchTab(b.dataset.tab)));
$("#stand").addEventListener("change", () => setStand(currentStand()));
(async function init() {
  try {
    await loadMeta(); await loadPackages();
    const want = store.get("stand", "default.json");
    const file = META.stands.some(s => s.file === want) ? want : (META.stands[0]?.file || "default.json");
    TAB = store.get("tab", "create");
    await setStand(file);
    switchTab(TAB);
  } catch (e) {
    $("main").innerHTML = ""; $("main").append(h("div", { class: "msg err" }, "Не удалось загрузить данные: " + e.message));
  }
})();
</script>
